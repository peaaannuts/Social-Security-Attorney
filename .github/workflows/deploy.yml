name: Deploy to GitHub Pages

on:
  push:
    # このリポジトリの既定ブランチ（GitHub Pages 環境が許可するブランチ）から配信する。
    # 既定ブランチを main に変更した場合は main からも配信される。
    branches: [main, claude/app-creation-pnxoh1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # プロジェクトページ（https://<user>.github.io/<repo>/）配信用に base を設定
      - run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
